version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: CICD/Dockerfile.backend.dev
    container_name: minga_backend_dev
    volumes:
      - ../:/app
      - /app/.venv  # Prevent overwriting venv
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=dev-secret-key-change-in-production
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
      - DATABASE_ENGINE=sqlite3
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    networks:
      - minga_network

  frontend:
    build:
      context: ..
      dockerfile: CICD/Dockerfile.frontend.dev
    container_name: minga_frontend_dev
    volumes:
      - ../frontend:/app
      - /app/node_modules  # Prevent overwriting node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/
    depends_on:
      - backend
    networks:
      - minga_network

networks:
  minga_network:
    driver: bridge
